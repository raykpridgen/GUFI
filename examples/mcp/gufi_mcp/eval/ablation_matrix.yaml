# Server ablation configs for run_ablation.py (ablation_design.md section 5).
#
# Factors and levels (gufi_ablation.py); a row lists only the factors it changes from `full`:
#   submission: pydantic | plain     schema: hints | naive | none
#   primer: 1 | 0                    functions: 1 | 0       path: server | rpath
#
# Every row of a sweep runs with the same eval settings (see `settings`), so results are
# comparable. run_ablation.py skips a config that already has a finished run with the same
# factors and settings, so the factorial reuses pilot runs and an interrupted sweep resumes.

settings:
  mode: single
  trials: 10
  max_attempts: 3
  max_tool_calls: 15
  timeout: 180
  concurrency: 4

phases:
  # Leave-one-out from the full server, plus the sparsest server. Run first to check wiring,
  # variance, and cost before the factorial.
  pilot:
    - id: full
    - id: minimal
      submission: plain
      schema: none
      primer: 0
      functions: 0
      path: rpath
    - id: no_primer
      primer: 0
    - id: no_functions
      functions: 0
    - id: no_schema
      schema: none
    - id: naive_schema
      schema: naive
    - id: rpath
      path: rpath
    - id: plain
      submission: plain

  # All 2 x 3 x 2 x 2 x 2 = 48 combinations, generated by run_ablation.py; ids are the
  # config ids (e.g. py-hints-p1-f1-server).
  factorial: all
