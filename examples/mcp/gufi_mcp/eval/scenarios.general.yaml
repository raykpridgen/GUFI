# General-usage scenarios (eval_design.md Part 4). The agent sees every tool and resource.
# There is no pass/fail in v1: traces, metrics, and the final message are recorded.
# Same keys as scenarios.single.yaml; ground_truth is always null.
#
# Prompts are written the way a user would ask: no GUFI function, column, or type names, no
# formulas, and no timestamps (the system prompt gives the current time). Each scenario asks a
# distinct question; notes name the nearest neighbour and how this one differs.

- id: largest_directories
  prompt: "Which directories in {index} hold the most data directly inside them?"
  tags: [size, directories, starter]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Bytes of the files directly in each directory. Nearest: directories_with_many_files (a file count), tree_overview (whole subtrees)."

- id: big_file_owners
  prompt: "Who owns the files over 1 GB in {index}, and where are those files?"
  tags: [size, uid, starter]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Owners and paths of the few very large files. Nearest: count_over_1gib (only a count), large_old_files (adds an age filter, lower size cut)."

- id: least_recently_accessed
  prompt: "Which files in {index} haven't been accessed in the longest time?"
  tags: [time, atime, starter]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Oldest by atime. Nearest: oldest_k (mtime), recent_activity (recent atime)."

- id: usage_by_user
  prompt: "Which users own the most data in {index}? Give me the top 5."
  tags: [size, uid]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Bytes per uid. Nearest: file_count_by_owner (file count per uid), stale_data_by_owner (only data older than 90 days)."

- id: files_per_group
  prompt: "How many files does each group own in {index}?"
  tags: [gid]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "File count per gid. Nearest: storage_by_group (bytes per gid), files_by_group (per-user breakdown inside one group)."

- id: recent_activity
  prompt: "Which files in {index} have been read in the past {parameters.days} days but not changed in that time? Give me a count and a few examples."
  tags: [time, atime]
  enabled: true
  index: eval_master
  parameters: {days: 7}
  ground_truth: null
  notes: "atime vs mtime over a window. Nearest: recently_modified_files (mtime, 30 days), accessed_after_modification (no window)."

- id: find_by_name
  prompt: "Find the HDF5 files in {index} with 'sim' in their names, and show where they are and how big they are."
  tags: [name]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Name pattern plus a file type the agent must map to .h5 (15 matches). Nearest: duplicate_names (also name-based, but aggregated)."

- id: tree_overview
  prompt: "Give me an overview of {index}: how much space each group directory under groups/ uses, and how many directories and files each one contains."
  tags: [treesummary, stats]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Subtree totals; gufi_du, gufi_stats, or treesummary SQL. Nearest: largest_directories (single directories, not subtrees)."

# Mirrored single-query prompts: same id, prompt, and parameters as scenarios.single.yaml,
# so the agent gets the same questions with the full tool catalog. test_gufi_eval.py checks they match.

- id: total_file_size
  prompt: "How many bytes do all the files in {index} take up?"
  tags: [size, total, mirrored]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Mirrored from scenarios.single.yaml; keep the prompt identical. Nearest: count_and_size (adds the count)."

- id: total_dir_size
  prompt: "How much space do the directories themselves take up in {index}, not counting the files inside them?"
  tags: [size, total, directories, mirrored]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Mirrored from scenarios.single.yaml; keep the prompt identical."

- id: ext_histogram
  prompt: "How many files of each extension are there in {index}?"
  tags: [name, histogram, mirrored]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
  notes: "Mirrored from scenarios.single.yaml; keep the prompt identical. Nearest: ext_winner (only the top one), storage_by_file_type (bytes, not counts)."

- id: size_histogram
  prompt: "Give me a breakdown of the files in {index} by size."
  tags: [size, histogram, mirrored]
  enabled: true
  index: eval_master
  parameters: {}
  ground_truth: null
